version: '3.8'

services:
  house-jobs:
    build:
      context: /mnt/apps/websites/house-jobs
      dockerfile: docker/Dockerfile
    container_name: house-jobs-tracker
    restart: unless-stopped
    ports:
      - "26001:26001"
    volumes:
      - ./data:/app
    environment:
      - TZ=America/Chicago